project_id = "adoetz-chat"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.login-identifier]
verify_jwt = false

[functions.admin]
verify_jwt = false
# Admin explicitly validates the bearer JWT via auth.getUser().
