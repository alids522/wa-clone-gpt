name: Signed Android candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_STORE_FILE: ${{ github.workspace }}/android/app/release.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true
      - name: Require signing and environment configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          for key in ['KEYSTORE','SIGNING_STORE_PASSWORD','SIGNING_KEY_ALIAS','SIGNING_KEY_PASSWORD','URL','KEY','FIREBASE_CONFIG']:
            if not os.environ.get(key): raise SystemExit('Required release configuration is missing: ' + key)
          pathlib.Path(os.environ['SIGNING_STORE_FILE']).write_bytes(base64.b64decode(os.environ['KEYSTORE']))
          pathlib.Path('config/ci.json').write_text(json.dumps({'SUPABASE_URL':os.environ['URL'],'SUPABASE_PUBLISHABLE_KEY':os.environ['KEY'],'FIREBASE_ENABLED':True}))
          pathlib.Path('android/app/google-services.json').write_text(os.environ['FIREBASE_CONFIG'])
          PY
          python3 tools/configure_firebase.py android/app/google-services.json
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --release --no-pub --build-number=${{ github.run_number }} --dart-define-from-file=config/ci.json
      - name: Verify notification resources survived release shrinking
        run: python3 tools/verify_release_resources.py build/app/outputs/flutter-apk/app-release.apk
      - run: cd build/app/outputs/flutter-apk && sha256sum app-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: adoetz-chat-signed-candidate
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Remove signing material
        if: always()
        run: rm -f "$SIGNING_STORE_FILE"
