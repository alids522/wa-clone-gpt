name: Android alpha
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --coverage
      - name: Configure optional staging backend
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          enabled = bool(os.environ.get('FIREBASE_CONFIG'))
          pathlib.Path('config/ci.json').write_text(json.dumps({
            'SUPABASE_URL': os.environ.get('SUPABASE_URL', ''),
            'SUPABASE_PUBLISHABLE_KEY': os.environ.get('SUPABASE_PUBLISHABLE_KEY', ''),
            'FIREBASE_ENABLED': enabled,
          }))
          if enabled:
            pathlib.Path('android/app/google-services.json').write_text(os.environ['FIREBASE_CONFIG'])
          PY
          if [ -f android/app/google-services.json ]; then python3 tools/configure_firebase.py android/app/google-services.json; fi
      - name: Build installable internal prototype (debug signing)
        run: flutter build apk --debug --no-pub --build-number=${{ github.run_number }} --dart-define-from-file=config/ci.json
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/adoetz-chat-0.2.0-internal.apk
          cd dist
          sha256sum adoetz-chat-0.2.0-internal.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: adoetz-chat-android-alpha-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/lcov.info
      - run: echo 'Internal prototype APK only. Production signing, backend integration and security acceptance tests remain required.' >> "$GITHUB_STEP_SUMMARY"
