name: Backend authorization
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rls-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: local-ci-only
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Create isolated Supabase Auth fixtures
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Apply versioned schema
        run: for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 --single-transaction -f "$migration"; done
      - name: Check invitation and authorization contracts
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/authorization.sql
      - name: Check devices, calls and Storage isolation
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/devices_calls_storage.sql
      - name: Check upgrade compatibility with legacy identities and outboxes
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/legacy_upgrade.sql
