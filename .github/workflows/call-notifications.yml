name: Android incoming-call notifications
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-14:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true
      - name: Configure Firebase without signing into a user account
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import os,pathlib
          pathlib.Path('android/app/google-services.json').write_text(os.environ['FIREBASE_CONFIG'])
          PY
          python3 tools/configure_firebase.py android/app/google-services.json
          flutter pub get --enforce-lockfile
          flutter build apk --debug --dart-define=FIREBASE_ENABLED=true --target-platform=android-x64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew app:connectedDebugAndroidTest -Pdart-defines=RklSRUJBU0VfRU5BQkxFRD10cnVl -Ptarget-platform=android-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-14-call-notification-results
          path: build/app/reports/androidTests/
