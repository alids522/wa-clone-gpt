name: adoetz_chat
description: Private invitation-only Android messenger. Internal technical prototype.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.18.3
  flutter_secure_storage: 11.2.0
  libsignal_protocol_dart: 0.8.2
  cryptography: 2.9.0
  shared_preferences: 2.5.5
  uuid: 4.5.3
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  file_picker: 13.3.0
  record: 7.1.2
  just_audio: 0.10.6
  open_filex: 5.0.0
  path_provider: 2.1.6
  flutter_webrtc: 1.6.3
  flutter_local_notifications: 22.3.3
  flutter_callkit_incoming: 3.1.6
  device_runtime:
    path: packages/device_runtime
dev_dependencies:
  http: 1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
